<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>African Currency & Utility Suite</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; box-sizing: border-box; }
        .container { background: #1e293b; padding: 1.5rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .tab-btn { flex: 1; padding: 0.5rem; background: #334155; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; }
        .section { display: none; }
        .section.active { display: block; }
        input, select { width: 100%; padding: 0.75rem; margin-top: 0.4rem; margin-bottom: 0.8rem; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        .result { font-size: 1.1rem; font-weight: bold; color: #38bdf8; margin-top: 0.5rem; }
        .calc-display { width: 100%; height: 50px; background: #0f172a; border: 1px solid #334155; color: #38bdf8; font-size: 1.5rem; text-align: right; padding: 0.5rem; border-radius: 6px; margin-bottom: 0.8rem; box-sizing: border-box; overflow-x: auto; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
        .calc-btn { padding: 0.75rem; background: #334155; border: none; color: white; font-size: 1rem; border-radius: 6px; cursor: pointer; }
        .calc-btn:hover { background: #475569; }
        .calc-btn.op { background: #0284c7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('converter')">Converter</button>
            <button class="tab-btn" onclick="switchTab('calculator')">Scientific Calc</button>
        </div>

        <!-- Converter Section -->
        <div id="converter" class="section active">
            <h2>Naira & African FX</h2>
            <p id="price-status" style="font-size: 0.8rem; color: #94a3b8;">Fetching live exchange rates...</p>
            
            <label>Amount (NGN - Naira):</label>
            <input type="number" id="ngn-amount" placeholder="0.00" value="1000" oninput="convertNaira()">
            
            <label>Target African Currency:</label>
            <select id="african-currency" onchange="convertNaira()">
                <option value="ZAR">ZAR (South African Rand)</option>
                <option value="KES">KES (Kenyan Shilling)</option>
                <option value="GHS">GHS (Ghanaian Cedi)</option>
                <option value="EGP">EGP (Egyptian Pound)</option>
                <option value="USD">USD (Global Baseline)</option>
            </select>
            <div class="result" id="naira-output">Converted: 0.00</div>
        </div>

        <!-- Scientific Calculator Section -->
        <div id="calculator" class="section">
            <div class="calc-display" id="calc-screen">0</div>
            <div class="calc-grid">
                <button class="calc-btn" onclick="clearCalc()">C</button>
                <button class="calc-btn" onclick="appendCalc('(')">(</button>
                <button class="calc-btn" onclick="appendCalc(')')">)</button>
                <button class="calc-btn op" onclick="appendCalc('/')">÷</button>
                
                <button class="calc-btn" onclick="appendCalc('7')">7</button>
                <button class="calc-btn" onclick="appendCalc('8')">8</button>
                <button class="calc-btn" onclick="appendCalc('9')">9</button>
                <button class="calc-btn op" onclick="appendCalc('*')">×</button>
                
                <button class="calc-btn" onclick="appendCalc('4')">4</button>
                <button class="calc-btn" onclick="appendCalc('5')">5</button>
                <button class="calc-btn" onclick="appendCalc('6')">6</button>
                <button class="calc-btn op" onclick="appendCalc('-')">-</button>
                
                <button class="calc-btn" onclick="appendCalc('1')">1</button>
                <button class="calc-btn" onclick="appendCalc('2')">2</button>
                <button class="calc-btn" onclick="appendCalc('3')">3</button>
                <button class="calc-btn op" onclick="appendCalc('+')">+</button>
                
                <button class="calc-btn" onclick="appendCalc('0')">0</button>
                <button class="calc-btn" onclick="appendCalc('.')">.</button>
                <button class="calc-btn op" onclick="calculateScientific('Math.sqrt(')">√</button>
                <button class="calc-btn op" onclick="calculateResult()">=</button>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        let exchangeRates = {};
        async function fetchRates() {
            document.getElementById('price-status').innerText = 'Updating rates...';
            try {
                // Using a free open exchangerates API base on USD
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();
                exchangeRates = data.rates;
                document.getElementById('price-status').innerText = 'Live FX rates loaded successfully.';
                convertNaira();
            } catch (e) {
                document.getElementById('price-status').innerText = 'Error fetching live rates.';
            }
        }

        function convertNaira() {
            if (!exchangeRates['NGN']) return;
            const ngnAmount = parseFloat(document.getElementById('ngn-amount').value) || 0;
            const targetCurrency = document.getElementById('african-currency').value;
            
            // Convert NGN to USD first, then to target currency
            const amountInUSD = ngnAmount / exchangeRates['NGN'];
            const convertedTotal = amountInUSD * exchangeRates[targetCurrency];
            
            document.getElementById('naira-output').innerText = `Converted: ${convertedTotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} ${targetCurrency}`;
        }

        let calcInput = '';
        function appendCalc(val) {
            calcInput += val;
            document.getElementById('calc-screen').innerText = calcInput;
        }
        function clearCalc() {
            calcInput = '';
            document.getElementById('calc-screen').innerText = '0';
        }
        function calculateResult() {
            try {
                let evaluated = eval(calcInput);
                document.getElementById('calc-screen').innerText = evaluated;
                calcInput = evaluated.toString();
            } catch (e) {
                document.getElementById('calc-screen').innerText = 'Error';
                calcInput = '';
            }
        }

        fetchRates();
    </script>
</body>
</html>
