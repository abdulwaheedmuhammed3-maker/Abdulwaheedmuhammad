<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global & African Currency Suite</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem; box-sizing: border-box; }
        .container { background: #1e293b; padding: 1.5rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
        .tab-btn { flex: 1; padding: 0.5rem; background: #334155; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #38bdf8; color: #0f172a; }
        .section { display: none; }
        .section.active { display: block; }
        input, select { width: 100%; padding: 0.75rem; margin-top: 0.4rem; margin-bottom: 0.8rem; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        .result { font-size: 1.1rem; font-weight: bold; color: #38bdf8; margin-top: 0.5rem; }
        .calc-display { width: 100%; height: 50px; background: #0f172a; border: 1px solid #334155; color: #38bdf8; font-size: 1.5rem; text-align: right; padding: 0.5rem; border-radius: 6px; margin-bottom: 0.8rem; box-sizing: border-box; overflow-x: auto; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
        .calc-btn { padding: 0.75rem; background: #334155; border: none; color: white; font-size: 1rem; border-radius: 6px; cursor: pointer; }
        .calc-btn:hover { background: #475569; }
        .calc-btn.op { background: #0284c7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab-btn active" id="btn-converter">Converter</button>
            <button class="tab-btn" id="btn-calculator">Scientific Calc</button>
        </div>

        <!-- Converter Section -->
        <div id="converter" class="section active">
            <h2>Global & African FX</h2>
            <p id="price-status" style="font-size: 0.8rem; color: #94a3b8;">Fetching live exchange rates...</p>
            
            <label>Amount (NGN - Nigeria):</label>
            <input type="number" id="ngn-amount" placeholder="0.00" value="1000">
            
            <label>Target Currency:</label>
            <select id="target-currency">
        
                <optgroup label="West Africa">
                    <option value="NGN">NGN - Nigerian Naira (Nigeria)</option>
                    <option value="GHS">GHS - Ghanaian Cedi (Ghana)</option>
                    <option value="XOF" selected>XOF - West African CFA</option>
                    <option value="GMD">GMD - Gambian Dalasi</option>
                    <option value="GNF">GNF - Guinean Franc</option>
                    <option value="LRD">LRD - Liberian Dollar</option>
                </optgroup>
                <optgroup label="Other African Regions">
                    <option value="ZAR">ZAR - South African Rand</option>
                    <option value="KES">KES - Kenyan Shilling</option>
                    <option value="EGP">EGP - Egyptian Pound</option>
                    <option value="MAD">MAD - Moroccan Dirham</option>
                    <option value="ETB">ETB - Ethiopian Birr</option>
                </optgroup>
                <optgroup label="Other exchange">
                    <option value="USD">USD - US Dollar (USA)</option>
                    <option value="CNY">CNY - Chinese Yuan (China)</option>
                    <option value="RUB">RUB - Russian Ruble (Russia)</option>
                </optgroup>
            </select>
            <div class="result" id="conversion-output">Converted: 0.00</div>
        </div>

        <!-- Scientific Calculator Section -->
        <div id="calculator" class="section">
            <div class="calc-display" id="calc-screen">0</div>
            <div class="calc-grid">
                <button class="calc-btn" data-val="C">C</button>
                <button class="calc-btn" data-val="(">(</button>
                <button class="calc-btn" data-val=")">)</button>
                <button class="calc-btn op" data-val="/">÷</button>
                
                <button class="calc-btn" data-val="7">7</button>
                <button class="calc-btn" data-val="8">8</button>
                <button class="calc-btn" data-val="9">9</button>
                <button class="calc-btn op" data-val="*">×</button>
                
                <button class="calc-btn" data-val="4">4</button>
                <button class="calc-btn" data-val="5">5</button>
                <button class="calc-btn" data-val="6">6</button>
                <button class="calc-btn op" data-val="-">-</button>
                
                <button class="calc-btn" data-val="1">1</button>
                <button class="calc-btn" data-val="2">2</button>
                <button class="calc-btn" data-val="3">3</button>
                <button class="calc-btn op" data-val="+">+</button>
                
                <button class="calc-btn" data-val="0">0</button>
                <button class="calc-btn" data-val=".">.</button>
                <button class="calc-btn op" data-func="Math.sqrt(">√</button>
                <button class="calc-btn op" data-action="calculate">=</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Tab switching logic
            document.getElementById('btn-converter').addEventListener('click', () => {
                document.getElementById('converter').classList.add('active');
                document.getElementById('calculator').classList.remove('active');
                document.getElementById('btn-converter').classList.add('active');
                document.getElementById('btn-calculator').classList.remove('active');
            });
            document.getElementById('btn-calculator').addEventListener('click', () => {
                document.getElementById('calculator').classList.add('active');
                document.getElementById('converter').classList.remove('active');
                document.getElementById('btn-calculator').classList.add('active');
                document.getElementById('btn-converter').classList.remove('active');
            });

            // Currency conversion logic
            let exchangeRates = {};
            const amountInput = document.getElementById('ngn-amount');
            const currencySelect = document.getElementById('target-currency');
            const priceStatus = document.getElementById('price-status');
            const conversionOutput = document.getElementById('conversion-output');

            async function fetchRates() {
                priceStatus.innerText = 'Updating live exchange rates...';
                try {
                    const res = await fetch('https://open.er-api.com/v6/latest/USD');
                    const data = await res.json();
                    exchangeRates = data.rates;
                    priceStatus.innerText = 'Live FX rates loaded successfully.';
                    convertCurrency();
                } catch (e) {
                    priceStatus.innerText = 'Error fetching live rates.';
                }
            }

            function convertCurrency() {
                if (!exchangeRates['NGN']) return;
                const ngnAmount = parseFloat(amountInput.value) || 0;
                const targetCurrency = currencySelect.value;
                
                const amountInUSD = ngnAmount / exchangeRates['NGN'];
                const convertedTotal = amountInUSD * exchangeRates[targetCurrency];
                
                conversionOutput.innerText = `Converted: ${convertedTotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})} ${targetCurrency}`;
            }

            amountInput.addEventListener('input', convertCurrency);
            currencySelect.addEventListener('change', convertCurrency);
            fetchRates();

            // Calculator logic
            let calcInput = '';
            const calcScreen = document.getElementById('calc-screen');

            document.querySelectorAll('.calc-grid button').forEach(button => {
                button.addEventListener('click', () => {
                    const val = button.getAttribute('data-val');
                    const func = button.getAttribute('data-func');
                    const action = button.getAttribute('data-action');

                    if (val === 'C') {
                        calcInput = '';
                        calcScreen.innerText = '0';
                    } else if (action === 'calculate') {
                        try {
                            let evaluated = eval(calcInput);
                            calcScreen.innerText = evaluated;
                            calcInput = evaluated.toString();
                        } catch (e) {
                            calcScreen.innerText = 'Error';
                            calcInput = '';
                        }
                    } else if (func) {
                        calcInput += func;
                        calcScreen.innerText = calcInput;
                    } else if (val) {
                        calcInput += val;
                        calcScreen.innerText = calcInput;
                    }
                });
            });
        });
    </script>
</body>
</html>
